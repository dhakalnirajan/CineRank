name: CineRank CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: test
      DATABASE_URL: sqlite:///./data/ci.db
      SECRET_KEY: test-secret-key-that-is-long-enough-for-local-ci-only
      JWT_SECRET_KEY: test-jwt-secret-key-that-is-long-enough-for-local-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q app scripts crawler ranker
      - run: python -m alembic upgrade head
      - run: python -m alembic check
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  migrations:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: cinerank
          POSTGRES_USER: cinerank
          POSTGRES_PASSWORD: cinerank-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cinerank -d cinerank"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ENVIRONMENT: test
      DATABASE_URL: postgresql+psycopg://cinerank:cinerank-ci-password@127.0.0.1:5432/cinerank
      SECRET_KEY: ci-secret-key-not-used-for-migration-validation-000000000000000000
      JWT_SECRET_KEY: ci-jwt-secret-not-used-for-migration-validation-0000000000000000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-runtime.txt
      - run: python -m alembic upgrade head
      - run: python -m alembic current
      - run: python -m alembic check
      - name: Validate runtime schema guard
        run: |
          python - <<'PY'
          from sqlalchemy import create_engine
          from app.core.config import settings
          from app.db.schema_guard import validate_database_schema
          validate_database_schema(create_engine(settings.DATABASE_URL))
          print("schema guard passed")
          PY

  redis-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      CINERANK_TEST_REDIS_URL: redis://127.0.0.1:6379/15
      SECRET_KEY: ci-secret-key-not-used-for-redis-tests-000000000000000000000000
      JWT_SECRET_KEY: ci-jwt-secret-not-used-for-redis-tests-000000000000000000000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: python -m pip install -r requirements-runtime.txt pytest
      - run: python -m pytest tests/test_redis_integration.py -q

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install pip-audit
      - run: python -m pip_audit -r backend/requirements-runtime.txt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm audit --omit=dev --audit-level=high
        working-directory: frontend

  docker-build:
    runs-on: ubuntu-latest
    needs: [backend, frontend, migrations, redis-integration, security-scan]
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configuration
        env:
          SECRET_KEY: ci-secret-key-not-used-for-build-validation-000000000000000000000000000000
          JWT_SECRET_KEY: ci-jwt-secret-not-used-for-build-validation-000000000000000000000000000000
          POSTGRES_PASSWORD: ci-postgres-password
          REDIS_PASSWORD: ci-redis-password
          GRAFANA_ADMIN_PASSWORD: ci-grafana-password
        run: docker compose config --quiet
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: api
          push: false
          tags: cinerank/api:ci
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          target: web
          push: false
          tags: cinerank/web:ci
